name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    # a scratch Postgres for the hosted-database tests (packages/server/test/db.test.ts)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: heist
          POSTGRES_DB: heist_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck engine
        run: npx tsc -p packages/engine --noEmit
      - name: Engine tests
        run: npm test
      - name: Bot games (100 per player count)
        run: npm run sim -- 100
      - name: Progression rules typecheck and tests
        run: npx tsc -p packages/profile --noEmit && npm test -w packages/profile
      - name: Game server typecheck, tests and bundle
        run: npm test -w packages/server && npm run build -w packages/server
        env:
          TEST_DATABASE_URL: postgres://postgres:heist@localhost:5432/heist_test
      - name: Build the table
        run: npm run build
